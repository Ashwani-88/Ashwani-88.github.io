<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstroSketch – astronomy figure editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg2pdf.js/2.2.3/svg2pdf.umd.min.js"></script>
<style>
:root{--bg:#f4f5f7;--pn:#fff;--tx:#1b1f24;--mu:#667;--bd:#d5d9df;--ac:#2563eb;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--pn:#1d2026;--tx:#e8eaed;--mu:#9aa;--bd:#343942;--ac:#6b9bff;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:13px system-ui,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:grid;grid-template-columns:200px 1fr 240px;height:100vh}
aside{background:var(--pn);padding:10px;overflow:auto;border-right:1px solid var(--bd)}aside.r{border:0;border-left:1px solid var(--bd)}
h4{margin:12px 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}h4:first-child{margin-top:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px}
select.dd{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px}
button,input[type=number],input[type=text]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 6px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}
#cv{width:100%;max-width:1000px;background:#fff;box-shadow:0 2px 14px #0003;touch-action:none;user-select:none}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}.row label{width:62px;color:var(--mu)}.row input[type=range]{flex:1;min-width:0}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--bd);border-radius:5px;background:none}
.sw{display:flex;flex-wrap:wrap;gap:4px}.sw i{width:20px;height:20px;border-radius:4px;border:1px solid #8886;cursor:pointer}
input[type=number]{width:62px}small{color:var(--mu);display:block;margin-top:6px;line-height:1.35}
@media(max-width:800px){#app{grid-template-columns:1fr;height:auto}aside{border:0}}
</style></head><body>
<div id="app">
<aside id="lib"></aside>
<main><svg id="cv" xmlns="http://www.w3.org/2000/svg">
<defs class="ui"><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#0002" stroke-width=".5"/></pattern></defs>
<rect id="bg" fill="#fff"/><rect class="ui" id="gr" fill="url(#grid)" pointer-events="none"/>
<g id="layer" stroke-linecap="round" stroke-linejoin="round" font-family="Helvetica,Arial,sans-serif"></g></svg></main>
<aside class="r">
<h4>Selected object</h4>
<div class="row"><label>Fill</label><input type="color" id="fill"><label style="width:auto"><input type="checkbox" id="nf"> none</label></div>
<div class="row"><label>Stroke</label><input type="color" id="stroke"></div>
<div class="row"><label>Width</label><input type="range" id="sw" min="0" max="14" step=".5"></div>
<div class="row"><label>Opacity</label><input type="range" id="op" min=".05" max="1" step=".05"></div>
<div class="row"><label>Rotate</label><input type="range" id="rot" min="-180" max="180" step="1"></div>
<div class="row" id="krow" style="display:none"><label id="klab">Curve</label><input type="range" id="k" min="-1" max="1" step=".05"></div>
<div id="txtbox" style="display:none"><div class="row"><label>Text</label><input type="text" id="txt" style="flex:1;min-width:0"></div><div class="row"><select id="sym" class="dd"></select></div><small>Sub/superscripts: F_ν, M_{BH}, L^2</small></div>
<div class="row" id="labrow" style="display:none"><label style="width:auto"><input type="checkbox" id="lab" checked> Line labels</label></div>
<div class="g" style="margin-top:6px"><button id="fx">Flip</button><button id="dup">Duplicate</button><button id="fr">To front</button><button id="bk">To back</button><button id="del">Delete</button><button id="un">Undo</button></div>
<h4>Palette (colour-blind safe)</h4><div class="sw" id="pal"></div><small>Click = fill, Shift+click = stroke.</small>
<h4>Page</h4>
<div class="row"><label>W (mm)</label><input type="number" id="W" value="160"><label style="width:34px">H</label><input type="number" id="H" value="100"></div>
<div class="row"><label>PNG dpi</label><input type="number" id="dpi" value="300"></div>
<div class="row"><label style="width:auto"><input type="checkbox" id="snap"> Snap</label><label style="width:auto"><input type="checkbox" id="grid" checked> Grid</label><label style="width:auto"><input type="checkbox" id="tbg" checked> White bg</label></div>
<h4>Export</h4>
<div class="g"><button class="p" id="eSVG">SVG</button><button class="p" id="ePNG">PNG</button><button class="p" id="ePDF">PDF</button><button id="tpl">Blazar template</button><button id="sv">Save project</button><button id="ld">Load project</button></div>
<input type="file" id="file" accept=".json" hidden>
<small>Drag to move. Corner dot = resize (about the centre). Top dot = rotate (Shift = 15° steps). Red × = delete. Del = delete, Ctrl+Z = undo.</small>
</aside></div>
<script>
const $=s=>document.querySelector(s),U=4,cv=$('#cv');
let objs=[],sel=null,hist=[],uid=1,drag=null,S={W:160,H:100};
const PAL=['#000000','#E69F00','#56B4E9','#009E73','#F0E442','#0072B2','#D55E00','#CC79A7','#ffffff','#888888'];
// type:[group,label,w,h,fill,stroke,sw]
const SH={
rect:['Basic','Rectangle',120,80,'#56B4E9','#000000',2],sq:['Basic','Square',80,80,'#56B4E9','#000000',2],
ellipse:['Basic','Ellipse',120,80,'#E69F00','#000000',2],circle:['Basic','Circle',80,80,'#E69F00','#000000',2],
tri:['Basic','Triangle',80,80,'#009E73','#000000',2],star:['Basic','Star',70,70,'#F0E442','#000000',2],text:['Basic','Text',0,28,'#000000','#000000',0],pen:['_hidden','Freehand stroke',10,10,'none','#000000',3],
line:['Lines & curves','Line',160,10,'none','#000000',2.5],dash:['Lines & curves','Dashed line',160,10,'none','#000000',2.5],arrow:['Lines & curves','Arrow',160,10,'#000000','#000000',2.5],
darrow:['Lines & curves','Double arrow',160,10,'#000000','#000000',2.5],curve:['Lines & curves','Curved line',160,80,'none','#000000',2.5,.6],
carrow:['Lines & curves','Curved arrow',160,80,'#000000','#000000',2.5,.6],scurve:['Lines & curves','S-curve',160,80,'none','#000000',2.5,.6],
wave:['Photons & fields','Photon (wavy line)',160,24,'none','#D55E00',2.5],photon:['Photons & fields','Photon (wavy arrow)',160,24,'none','#D55E00',2.5],
rays:['Photons & fields','Radiating photons',120,120,'none','#D55E00',2],bfield:['Photons & fields','Magnetic field (dipole)',140,140,'none','#0072B2',2],
bhelix:['Photons & fields','Magnetic field (helical)',240,60,'none','#0072B2',2],
bh:['AGN structure','Black hole',50,50,'#000000','#E69F00',3],disk:['AGN structure','Accretion disk',260,70,'#E69F00','#D55E00',0],
corona:['AGN structure','Corona (halo)',240,90,'#56B4E9','#0072B2',1.5],lamp:['AGN structure','Corona (lamp-post)',60,60,'#56B4E9','#0072B2',0],
torusx:['AGN structure','Torus (cross-section)',300,100,'#8B5E3C','#4a2f1a',2],torus:['AGN structure','Torus (ring)',260,120,'#8B5E3C','#4a2f1a',2],
blr:['AGN structure','Broad-line region',180,110,'#009E73','#005c43',1,.25],cloud:['AGN structure','Cloud (NLR etc.)',120,70,'#56B4E9','#0072B2',2],
jet:['AGN structure','Jet (cone)',300,110,'#0072B2','#0072B2',0],host:['AGN structure','Host galaxy',360,240,'#CC79A7','#CC79A7',0],
outflow:['Outflows & winds','Biconical outflow (AGN)',300,160,'#56B4E9','#0072B2',2],ysoflow:['Outflows & winds','Bipolar outflow (young star)',320,130,'#56B4E9','#0072B2',2],bipneb:['Outflows & winds','Bipolar nebula (hourglass)',260,150,'#CC79A7','#8a4a76',2],wind:['Outflows & winds','Disk wind',240,140,'none','#009E73',2.5,.5],
telescope:['Instruments','Telescope',140,160,'#8da4c4','#222222',2],dish:['Instruments','Radio dish',140,150,'#d9dde3','#333333',2],
dome:['Instruments','Observatory (ground)',150,150,'#d9dde3','#333333',2],satellite:['Instruments','Observatory (space)',220,120,'#c9ced6','#333333',2],
observer:['Instruments','Observer (person)',70,140,'#888888','#333333',2],eye:['Instruments','Observer (eye)',100,60,'#56B4E9','#000000',2],
cont:['Spectra','Continuum only',220,140,'#ffffff','#000000',2],em:['Spectra','Emission lines',220,140,'#ffffff','#000000',2],
bn:['Spectra','Broad + narrow emission',220,140,'#ffffff','#000000',2],nar:['Spectra','Narrow emission only',220,140,'#ffffff','#000000',2],
abs:['Spectra','Absorption lines',220,140,'#ffffff','#000000',2],sed:['Spectra','Blazar SED (2 humps)',220,140,'#ffffff','#000000',2]};
const KS=new Set(['curve','carrow','scurve','wind','blr']);
const F=o=>o.nf?'none':o.fill,ST=o=>`fill="${F(o)}" stroke="${o.stroke}" stroke-width="${o.sw}"`;
const gid=o=>'g'+o.id,E=(rx,ry,cx=0,cy=0)=>`M${cx-rx},${cy}A${rx},${ry} 0 1 0 ${cx+rx},${cy}A${rx},${ry} 0 1 0 ${cx-rx},${cy}Z`;
const hit=(o,h=16)=>`<rect x="${-o.w/2}" y="${-h/2}" width="${o.w}" height="${h}" fill="#fff" fill-opacity="0"/>`;
const rng=s=>()=>(s=s*16807%2147483647)/2147483647,gs=(t,c,s,a)=>a*Math.exp(-((t-c)**2)/(2*s*s));
const LN=(o,d,x='')=>`${hit(o)}<path d="${d}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw}" ${x}/>`;
const head=(o,s)=>{const l=Math.max(o.sw*4.5,10),x=s*o.w/2;return `<polygon points="${x},0 ${x-s*l},${-l*.45} ${x-s*l},${l*.45}" fill="${o.stroke}" stroke="none"/>`};
const HL=o=>Math.max(o.sw*4.5,10),
HD=(x,y,a,o)=>{const l=HL(o);return `<polygon transform="translate(${x},${y}) rotate(${a})" points="0,0 ${-l},${-l*.45} ${-l},${l*.45}" fill="${o.stroke}" stroke="none"/>`},
HP=d=>`<path d="${d}" fill="none" stroke="#fff" stroke-opacity="0" stroke-width="14" pointer-events="stroke"/>`,
PS=(o,d,x='')=>`${HP(d)}<path d="${d}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw}" ${x}/>`,
esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;'),
tip=(x,y,dx,dy,o)=>{const m=Math.hypot(dx,dy)||1,l=HL(o)*.8;return[x-dx/m*l,y-dy/m*l,Math.atan2(dy,dx)*180/Math.PI]};
function rich(t,h){t=String(t==null?'':t);const re=/([_^])(\{[^}]*\}|[^{])/g,it=[];let last=0,m;
 while((m=re.exec(t))){if(m.index>last)it.push([t.slice(last,m.index),0]);it.push([m[2].replace(/^\{|\}$/g,''),m[1]=='_'?1:2]);last=re.lastIndex}
 if(last<t.length)it.push([t.slice(last),0]);const off=[0,.22*h,-.38*h];let cur=0,o='';
 it.forEach(([x,k])=>{const dy=off[k]-cur;cur=off[k];o+=`<tspan dy="${dy}" font-size="${k?h*.7:h}">${esc(x)}</tspan>`});return o}
function penPath(P){const f=v=>v.toFixed(1),m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let d=`M${f(P[0][0])},${f(P[0][1])}`;
 if(P.length==1)d+=`L${f(P[0][0]+.01)},${f(P[0][1])}`;else if(P.length==2)d+=`L${f(P[1][0])},${f(P[1][1])}`;
 else{const a=m(P[0],P[1]);d+=`L${f(a[0])},${f(a[1])}`;for(let i=1;i<P.length-1;i++){const b=m(P[i],P[i+1]);d+=`Q${f(P[i][0])},${f(P[i][1])} ${f(b[0])},${f(b[1])}`}const l=P[P.length-1];d+=`L${f(l[0])},${f(l[1])}`}return d}
const D={
rect:o=>`<rect x="${-o.w/2}" y="${-o.h/2}" width="${o.w}" height="${o.h}" ${ST(o)}/>`,
ellipse:o=>`<ellipse rx="${o.w/2}" ry="${o.h/2}" ${ST(o)}/>`,
tri:o=>`<polygon points="0,${-o.h/2} ${o.w/2},${o.h/2} ${-o.w/2},${o.h/2}" ${ST(o)}/>`,
star:o=>{let p='';for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180,r=i%2?.4:1;p+=`${Math.cos(a)*r*o.w/2},${Math.sin(a)*r*o.h/2} `}return `<polygon points="${p}" ${ST(o)}/>`},
text:o=>`<text text-anchor="middle" y="${o.h*.35}" font-size="${o.h}" fill="${o.fill}">${rich(o.text,o.h)}</text><rect x="${-o.w/2}" y="${-o.h/2}" width="${o.w}" height="${o.h}" fill="#fff" fill-opacity="0"/>`,
line:o=>LN(o,`M${-o.w/2},0H${o.w/2}`),
dash:o=>LN(o,`M${-o.w/2},0H${o.w/2}`,`stroke-dasharray="${o.sw*3},${o.sw*2.5}" stroke-linecap="butt"`),
arrow:o=>LN(o,`M${-o.w/2},0H${o.w/2-Math.max(o.sw*4.5,10)*.8}`)+head(o,1),
darrow:o=>LN(o,`M${-o.w/2+Math.max(o.sw*4.5,10)*.8},0H${o.w/2-Math.max(o.sw*4.5,10)*.8}`)+head(o,1)+head(o,-1),
wave:o=>{let d='';const c=Math.max(2,Math.round(o.w/50));for(let i=0;i<=160;i++){const t=i/160;d+=`${i?'L':'M'}${(-o.w/2+t*o.w).toFixed(1)},${(o.h/2*Math.sin(2*Math.PI*c*t)).toFixed(1)}`}return hit(o,Math.max(o.h,16))+`<path d="${d}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw}"/>`},
bh:o=>`<defs><radialGradient id="${gid(o)}"><stop offset=".55" stop-color="${o.stroke}" stop-opacity=".8"/><stop offset="1" stop-color="${o.stroke}" stop-opacity="0"/></radialGradient></defs><circle r="${o.w*.85}" fill="url(#${gid(o)})"/><ellipse rx="${o.w/2}" ry="${o.h/2}" ${ST(o)}/>`,
disk:o=>`<defs><radialGradient id="${gid(o)}"><stop offset=".1" stop-color="#fff"/><stop offset=".4" stop-color="${o.fill}"/><stop offset="1" stop-color="${o.stroke}" stop-opacity=".15"/></radialGradient></defs><ellipse rx="${o.w/2}" ry="${o.h/2}" fill="url(#${gid(o)})"/><ellipse rx="${o.w*.06}" ry="${o.h*.06}" fill="#000"/>`,
torus:o=>`<path fill-rule="evenodd" d="${E(o.w/2,o.h/2)}${E(o.w*.27,o.h*.27)}" fill="${F(o)}" stroke="${o.stroke}" stroke-width="${o.sw}" fill-opacity=".85"/>`,
torusx:o=>{const r=o.w*.14,x=o.w/2-r;return `<ellipse cx="${-x}" rx="${r}" ry="${o.h/2}" ${ST(o)}/><ellipse cx="${x}" rx="${r}" ry="${o.h/2}" ${ST(o)}/>`},
cloud:o=>{const c=[[-.28,.12,.26,.3],[0,-.12,.3,.38],[.3,.1,.26,.3],[-.05,.18,.3,.3],[.15,-.02,.25,.3]],e=(x,y,a,b,s)=>`<ellipse cx="${x*o.w}" cy="${y*o.h}" rx="${a*o.w}" ry="${b*o.h}" ${s}/>`;
 return c.map(a=>e(...a,`fill="${o.stroke}" stroke="${o.stroke}" stroke-width="${o.sw*2}"`)).join('')+c.map(a=>e(...a,`fill="${F(o)}" stroke="none"`)).join('')},
blr:o=>{const r=rng(7),gap=Math.min(90,Math.abs(o.k)*60)*Math.PI/180;let s='';for(let i=0;i<34;i++){const a=r()*6.283,q=.5+.5*Math.sqrt(r()),k=.03+.03*r(),X=Math.cos(a)*q*o.w*.46,Y=Math.sin(a)*q*o.h*.46;if(Math.atan2(Math.abs(X),Math.abs(Y))<gap)continue;s+=`<ellipse cx="${X}" cy="${Y}" rx="${o.w*k}" ry="${o.w*k*.9}" ${ST(o)} fill-opacity=".85"/>`}return s+hit(o,o.h).replace('y="-'+o.h/2+'"','y="'+-o.h/2+'"')},
jet:o=>`<defs><linearGradient id="${gid(o)}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${o.fill}"/><stop offset="1" stop-color="${o.fill}" stop-opacity=".08"/></linearGradient></defs><path d="M${-o.w/2},${-o.h*.03}Q0,${-o.h*.12} ${o.w/2},${-o.h/2}V${o.h/2}Q0,${o.h*.12} ${-o.w/2},${o.h*.03}Z" fill="url(#${gid(o)})" stroke="${o.stroke}" stroke-width="${o.sw}" stroke-opacity=".6"/>`,
host:o=>`<defs><radialGradient id="${gid(o)}"><stop offset="0" stop-color="${o.fill}" stop-opacity=".95"/><stop offset="1" stop-color="${o.fill}" stop-opacity="0"/></radialGradient></defs><ellipse rx="${o.w/2}" ry="${o.h/2}" fill="url(#${gid(o)})"/>`
};
D.corona=o=>{const r=rng(11);let d='';for(let i=0;i<46;i++){const a=r()*6.283,q=Math.sqrt(r())*.88;d+=`<circle cx="${Math.cos(a)*q*o.w/2}" cy="${Math.sin(a)*q*o.h/2}" r="${Math.max(1.3,o.w*.007)}" fill="${o.stroke}" fill-opacity=".8"/>`}
 return `<defs><radialGradient id="${gid(o)}"><stop offset="0" stop-color="${o.fill}" stop-opacity=".75"/><stop offset=".7" stop-color="${o.fill}" stop-opacity=".45"/><stop offset="1" stop-color="${o.fill}" stop-opacity=".08"/></radialGradient></defs><ellipse rx="${o.w/2}" ry="${o.h/2}" fill="url(#${gid(o)})" stroke="${o.sw?o.stroke:'none'}" stroke-width="${o.sw}" stroke-dasharray="${o.sw*4},${o.sw*3}" stroke-linecap="butt"/>`+d};
D.lamp=o=>`<defs><radialGradient id="${gid(o)}"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="${o.fill}"/><stop offset="1" stop-color="${o.fill}" stop-opacity="0"/></radialGradient></defs><ellipse rx="${o.w/2}" ry="${o.h/2}" fill="url(#${gid(o)})"/>`;
Object.assign(D,{curve:o=>{const L=o.w/2;return PS(o,`M${-L},0Q0,${-o.k*o.h} ${L},0`)},
carrow:o=>{const L=o.w/2,cy=-o.k*o.h,[ex,ey,a]=tip(L,0,L,-cy,o);return PS(o,`M${-L},0Q0,${cy} ${ex},${ey}`)+HD(L,0,a,o)},
scurve:o=>{const L=o.w/2,c=o.k*o.h;return PS(o,`M${-L},0C${-L*.4},${-c} ${L*.4},${c} ${L},0`)},
photon:o=>{const c=Math.max(2,Math.round(o.w/50)),A=o.h/2,len=o.w-HL(o)*.8;let d='';for(let i=0;i<=160;i++){const t=i/160;d+=`${i?'L':'M'}${(-o.w/2+t*len).toFixed(1)},${(A*Math.sin(2*Math.PI*c*t)).toFixed(1)}`}return PS(o,d)+HD(o.w/2,0,0,o)},
rays:o=>{let s='';for(let i=0;i<12;i++){const a=i*Math.PI/6,X=Math.cos(a)*o.w/2,Y=Math.sin(a)*o.h/2,x0=X*.35,y0=Y*.35,[ex,ey,an]=tip(X,Y,X-x0,Y-y0,o);s+=PS(o,`M${x0},${y0}L${ex},${ey}`)+HD(X,Y,an,o)}return s},
bfield:o=>{const ys=o.h/2/.385;let s='';for(const L of[.35,.65,1])for(const g of[1,-1]){let d='';for(let i=0;i<=60;i++){const t=Math.PI*i/60;d+=`${i?'L':'M'}${(g*L*Math.sin(t)**3*o.w/2).toFixed(1)},${(-L*Math.sin(t)**2*Math.cos(t)*ys).toFixed(1)}`}s+=PS(o,d)+HD(g*L*o.w/2,0,90,o)}return s+`<circle r="${o.sw*1.6}" fill="${o.stroke}"/>`},
bhelix:o=>{const c=Math.max(2,Math.round(o.w/60)),A=o.h/2,N=240;let f='',b='',pf=null,pp='';
 for(let i=0;i<=N;i++){const t=i/N,ph=2*Math.PI*c*t,pt=`${(-o.w/2+t*o.w).toFixed(1)},${(A*Math.sin(ph)).toFixed(1)}`,fr=Math.cos(ph)>=0;
  if(i==0||fr!==pf){if(fr)f+=(i?`M${pp}L`:'M')+pt;else b+=(i?`M${pp}L`:'M')+pt}else{if(fr)f+='L'+pt;else b+='L'+pt}pf=fr;pp=pt}
 return HP(f)+HP(b)+`<path d="${b}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw}" stroke-opacity=".35"/><path d="${f}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw}"/>`},
